name: Windows build and release
on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Test
        shell: pwsh
        run: ./scripts/test.ps1
      - name: Publish portable application
        shell: pwsh
        run: ./scripts/publish.ps1
      - name: Package
        shell: pwsh
        run: |
          dotnet run --project tests/YoChat.Tests/YoChat.Tests.csproj -c Release --no-restore -- --audio-regression artifacts/YoChat-win-x64/models/vosk-model-small-en-us-0.15 tests/fixtures/wake-audio
          if ($LASTEXITCODE -ne 0) { throw 'Acoustic wake regression failed' }
          $check = Start-Process -FilePath artifacts/YoChat-win-x64/YoChat.exe -ArgumentList '--self-test' -Wait -PassThru -WindowStyle Hidden
          if ($check.ExitCode -ne 0) { throw 'Packaged application self-test failed' }
          Compress-Archive -Path artifacts/YoChat-win-x64/* -DestinationPath artifacts/YoChat-win-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: YoChat-win-x64
          path: artifacts/YoChat-win-x64.zip
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: YoChat-win-x64
          path: release
      - name: Publish tagged release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create '${{ github.ref_name }}' release/YoChat-win-x64.zip --repo '${{ github.repository }}' --generate-notes
